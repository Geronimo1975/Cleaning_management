{% load static %}

<div class="job-statistics-widget">
    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card h-100 border-0 shadow-sm">
                <div class="card-body">
                    <h6 class="card-title text-muted mb-3">Jobs by Status</h6>
                    <div class="chart-container" style="position: relative; height: 200px;">
                        <canvas id="jobStatusChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-md-6 mb-4">
            <div class="card h-100 border-0 shadow-sm">
                <div class="card-body">
                    <h6 class="card-title text-muted mb-3">Jobs by Type</h6>
                    <div class="chart-container" style="position: relative; height: 200px;">
                        <canvas id="jobTypeChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-md-12">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <h6 class="card-title text-muted mb-3">Job Trends (Last 12 Weeks)</h6>
                    <div class="chart-container" style="position: relative; height: 250px;">
                        <canvas id="jobTrendsChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Define chart colors
    const chartColors = {
        primary: '#0052CC',
        success: '#00875A',
        warning: '#FFAB00',
        danger: '#FF5630',
        info: '#00B8D9',
        purple: '#6554C0',
        completed: '#36B37E',
        cancelled: '#FF8F73',
        pending: '#FFC400',
        inProgress: '#4C9AFF'
    };
    
    // Jobs by Status Chart
    const statusCtx = document.getElementById('jobStatusChart').getContext('2d');
    const statusData = {{ job_status_data|safe }};
    
    new Chart(statusCtx, {
        type: 'doughnut',
        data: {
            labels: statusData.labels,
            datasets: [{
                data: statusData.data,
                backgroundColor: [
                    chartColors.completed,
                    chartColors.inProgress,
                    chartColors.pending,
                    chartColors.cancelled,
                    chartColors.primary
                ],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '60%',
            plugins: {
                legend: {
                    position: 'right',
                    labels: {
                        boxWidth: 12,
                        padding: 10,
                        font: {
                            size: 11
                        }
                    }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const label = context.label || '';
                            const value = context.raw || 0;
                            const total = context.dataset.data.reduce((a, b) => a + b, 0);
                            const percentage = Math.round((value / total) * 100);
                            return `${label}: ${value} (${percentage}%)`;
                        }
                    }
                }
            }
        }
    });
    
    // Jobs by Type Chart
    const typeCtx = document.getElementById('jobTypeChart').getContext('2d');
    const typeData = {{ job_type_data|safe }};
    
    new Chart(typeCtx, {
        type: 'polarArea',
        data: {
            labels: typeData.labels,
            datasets: [{
                data: typeData.data,
                backgroundColor: [
                    chartColors.primary,
                    chartColors.success,
                    chartColors.warning,
                    chartColors.danger,
                    chartColors.info,
                    chartColors.purple
                ],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'right',
                    labels: {
                        boxWidth: 12,
                        padding: 8,
                        font: {
                            size: 11
                        }
                    }
                }
            }
        }
    });
    
    // Job Trends Chart
    const trendsCtx = document.getElementById('jobTrendsChart').getContext('2d');
    const trendsData = {{ job_trends_data|safe }};
    
    new Chart(trendsCtx, {
        type: 'line',
        data: {
            labels: trendsData.labels,
            datasets: [
                {
                    label: 'New Jobs',
                    data: trendsData.new_jobs,
                    borderColor: chartColors.primary,
                    backgroundColor: 'rgba(0, 82, 204, 0.1)',
                    borderWidth: 2,
                    tension: 0.3,
                    fill: true
                },
                {
                    label: 'Completed Jobs',
                    data: trendsData.completed_jobs,
                    borderColor: chartColors.success,
                    backgroundColor: 'rgba(0, 135, 90, 0.1)',
                    borderWidth: 2,
                    tension: 0.3,
                    fill: true
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: {
                    grid: {
                        display: false
                    }
                },
                y: {
                    beginAtZero: true,
                    grace: '5%'
                }
            },
            plugins: {
                legend: {
                    position: 'top',
                    align: 'end'
                }
            }
        }
    });
});
</script>
