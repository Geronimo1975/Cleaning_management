<div class="time-tracking-widget">
    <div class="row">
        <div class="col-md-6">
            <div class="stats-value text-center mb-3">
                <h3 class="mb-0">{{ total_hours }}</h3>
                <p class="text-muted mb-0">Total Hours</p>
            </div>
        </div>
        <div class="col-md-6">
            <div class="stats-value text-center mb-3">
                <h3 class="mb-0">{{ average_daily_hours }}</h3>
                <p class="text-muted mb-0">Avg Daily Hours</p>
            </div>
        </div>
    </div>
    <div class="progress mb-3" style="height: 10px;">
        <div class="progress-bar bg-primary" role="progressbar" style="width: 100%;" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
    </div>
    <p class="small text-muted">Time tracking data from {{ start_date }} to {{ end_date }}</p>
</div>
